<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offcanvas Navigation</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <style>
        /* Basic styles for the offcanvas menu */
        .offcanvas {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background-color: #333;
            color: white;
            padding: 15px;
            transition: left 0.3s ease;
        }
        .offcanvas.open {
            left: 0;
        }
        .offcanvas ul {
            list-style-type: none;
            padding-left: 0;
        }
        .offcanvas li {
            margin: 10px 0;
        }
        .submenu {
            display: none;
            padding-left: 15px;
        }
        .submenu.open {
            display: block;
        }
        .offcanvas a {
            color: white;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <!-- Button to open the offcanvas menu -->
    <button class="btn btn-primary" id="openMenuBtn">Open Menu</button>

    <!-- Offcanvas navigation -->
    <div class="offcanvas" id="offcanvasMenu">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li>
                <a href="#" class="submenuToggle">Services</a>
                <ul class="submenu">
                    <li><a href="web-design.html" class="submenuLink">Web Design</a></li>
                    <li><a href="seo.html" class="submenuLink">SEO</a></li>
                    <li><a href="consulting.html" class="submenuLink">Consulting</a></li>
                </ul>
            </li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <!-- Include Bootstrap JS for interactive elements -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS to handle the menu behavior -->
    <script>
        // Toggle the offcanvas menu
        const openMenuBtn = document.getElementById('openMenuBtn');
        const offcanvasMenu = document.getElementById('offcanvasMenu');
        openMenuBtn.addEventListener('click', () => {
            offcanvasMenu.classList.toggle('open');
        });

        // Handle submenu toggling
        const submenuToggle = document.querySelector('.submenuToggle');
        const submenu = document.querySelector('.submenu');
        submenuToggle.addEventListener('click', (e) => {
            e.preventDefault();  // Prevent default link behavior
            submenu.classList.toggle('open');
        });

        // Handle submenu link clicks
        const submenuLinks = document.querySelectorAll('.submenuLink');
        submenuLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();  // Prevent page navigation for demo purposes
                
                // Get the href attribute of the clicked link
                const linkURL = e.target.getAttribute('href');
                
                // Close the offcanvas menu
                offcanvasMenu.classList.remove('open');
                
                // Redirect to the link's URL
                window.location.href = linkURL;
            });
        });
    </script>

</body>
</html>

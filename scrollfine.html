<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nested Scroll Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      font-family: Arial, sans-serif;
    }

    #trigger {
      position: relative;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
    }

    /* Nested animation container with natural height */
    .animation-container {
      position: relative;
      height: 120vh; /* Slightly taller for smooth animation */
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scaled {
      font-size: 4rem;
      font-weight: bold;
      color: white;
      z-index: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      will-change: transform, opacity;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      line-height: 1.2;
    }

    .scrolled-block {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 1160px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 3px solid #f093fb;
      border-radius: 20px;
      padding: 3rem;
      z-index: 2;
      will-change: transform;
      box-shadow: 0 -20px 40px rgba(0,0,0,0.2);
      height: 180px;
      transform-origin: bottom center;
    }

    .scrolled-block h2 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .scrolled-block p {
      color: #666;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      text-align: center;
    }

    #after {
      height: 100vh;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: white;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #final {
      height: 100vh;
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: white;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    @media (max-width: 768px) {
      .scaled {
        font-size: 2.5rem;
        padding: 0 1rem;
      }
      
      .scrolled-block {
        max-width: 90%;
        padding: 2rem;
        height: 160px;
      }
      
      .scrolled-block h2 {
        font-size: 1.5rem;
      }
      
      .scrolled-block p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <section id="trigger">
    <div class="animation-container">
      <div class="scaled">Scroll Down and Watch Me Disappear</div>
      <div class="scrolled-block">
        <h2>🚀 Amazing Content Block</h2>
        <p>This block smoothly grows as you scroll down.</p>
        <p>Animation is based on the nested container!</p>
        <p>Scroll back up to see the reverse animation.</p>
      </div>
    </div>
  </section>

  <section id="after">Keep Scrolling Down</section>
  
  <section id="final">End of Demo</section>

  <script>
    const animationContainer = document.querySelector('.animation-container');
    const scaled = animationContainer.querySelector('.scaled');
    const block = animationContainer.querySelector('.scrolled-block');

    let ticking = false;

    function updateScrollEffect() {
      const containerRect = animationContainer.getBoundingClientRect();
      const containerHeight = animationContainer.offsetHeight;
      const windowHeight = window.innerHeight;
      
      // Calculate progress based on the nested container
      let progress = 0;
      
      if (containerRect.top <= 0 && containerRect.bottom >= windowHeight) {
        // Container is actively scrolling through viewport
        const scrolledIntoView = Math.abs(containerRect.top);
        const maxScroll = containerHeight - windowHeight;
        progress = scrolledIntoView / maxScroll;
        progress = Math.min(Math.max(progress, 0), 1);
      } else if (containerRect.top > 0) {
        // Container hasn't entered viewport yet
        progress = 0;
      } else {
        // Container has fully passed through viewport
        progress = 1;
      }

      // Smooth easing for better animation feel
      const easeProgress = progress < 0.5 
        ? 2 * progress * progress
        : 1 - Math.pow(-2 * progress + 2, 2) / 2;

      // Scale and fade text
      const scale = 1 - 0.7 * easeProgress;
      const opacity = 1 - easeProgress;
      
      scaled.style.transform = `translate(-50%, -50%) scale(${scale})`;
      scaled.style.opacity = opacity;

      // Grow block from bottom
      const scaleY = 1 + (2.5 * easeProgress); // Grow to 3.5x original size
      
      block.style.transform = `translateX(-50%) scaleY(${scaleY})`;

      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        requestAnimationFrame(updateScrollEffect);
        ticking = true;
      }
    }

    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick);

    updateScrollEffect();
  </script>

</body>
</html>

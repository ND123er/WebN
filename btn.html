<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiper Slider with Prev and Next Buttons</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        /* Style the Swiper container */
        .swiper {
            width: 100%;
            height: 300px;
        }

        /* Style each slide */
        .swiper-slide {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #ddd;
            height: 100%;
            font-size: 20px;
        }

        /* Style navigation buttons */
        .swiper-button-prev,
        .swiper-button-next {
            color: #fff;
            width: 40px;
            height: 40px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
        }

        .swiper-button-prev {
            left: 10px;
        }

        .swiper-button-next {
            right: 10px;
        }
    </style>
</head>

<body>
    <section class="slider">
        <!-- Swiper container -->
        <div class="swiper">
            <!-- Wrapper for slides -->
            <div class="swiper-wrapper">
                <!-- Slide 1 -->
                <div class="swiper-slide">
                    Slide 1
                </div>
                <!-- Slide 2 -->
                <div class="swiper-slide">
                    Slide 2
                </div>
                <!-- Slide 3 -->
                <div class="swiper-slide">
                    Slide 3
                </div>
                <!-- Slide 4 -->
                <div class="swiper-slide">
                    Slide 4
                </div>
            </div>

            <!-- Navigation buttons -->
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </section>

    <!-- Include Swiper JS -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

    <!-- Initialize Swiper -->
    <script>
        const swiper = new Swiper('.swiper', {
            loop: true, // Enable infinite looping of slides
            spaceBetween: 10, // Space between slides
            slidesPerView: 1, // Number of slides to show at once
            navigation: {
                nextEl: '.swiper-button-next', // Next button
                prevEl: '.swiper-button-prev'  // Prev button
            }
        });
    </script>
</body>

</html>

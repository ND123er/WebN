<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Accordion</title>
  <style>
    /* Reset default styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Accordion container */
    .accordion {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
    }

    /* Hide the checkboxes */
    .accordion input[type="checkbox"] {
      display: none;
    }

    /* Style for the accordion labels */
    .accordion label {
      display: block;
      padding: 10px;
      background-color: #f1f1f1;
      cursor: pointer;
      font-weight: bold;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 5px;
      position: relative;
    }

    /* Add plus sign before the label */
    .accordion label::before {
      content: '+';
      font-size: 20px;
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
    }

    /* Change plus to minus when checkbox is checked */
    .accordion input[type="checkbox"]:checked + label::before {
      content: '−';
    }

    /* Style for the accordion content */
    .accordion .content {
      display: none;
      padding: 10px;
      background-color: #fafafa;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 4px;
    }

    /* Show content when checkbox is checked */
    .accordion input[type="checkbox"]:checked + label + .content {
      display: block;
    }

    /* Responsive design */
    @media (max-width: 768px) {
      .accordion label {
        font-size: 14px;
        padding: 8px;
      }

      .accordion .content {
        font-size: 14px;
        padding: 8px;
      }
    }
  </style>
</head>
<body>

  <div class="accordion">
    <input type="checkbox" id="section1">
    <label for="section1">Section 1</label>
    <div class="content">
      <p>This is the content of Section 1.</p>
    </div>

    <input type="checkbox" id="section2">
    <label for="section2">Section 2</label>
    <div class="content">
      <p>This is the content of Section 2.</p>
    </div>

    <input type="checkbox" id="section3">
    <label for="section3">Section 3</label>
    <div class="content">
      <p>This is the content of Section 3.</p>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fixed Scroll Parallax Effect</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      height: 300vh; /* Total scroll height */
      font-family: Arial, sans-serif;
    }

    #trigger {
      position: relative;
      height: 100vh; /* Standard viewport height */
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scaled {
      font-size: 4rem;
      font-weight: bold;
      color: white;
      z-index: 1;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      will-change: transform, opacity;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
      line-height: 1.2;
    }

    .scrolled-block {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(100%); /* Start completely below viewport */
      width: 100%;
      max-width: 1160px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border: 3px solid #f093fb;
      border-radius: 20px 20px 0 0; /* Only top corners rounded */
      padding: 3rem;
      z-index: 2;
      will-change: transform;
      box-shadow: 0 -20px 40px rgba(0,0,0,0.2);
    }

    .scrolled-block h2 {
      color: #333;
      font-size: 2rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .scrolled-block p {
      color: #666;
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      text-align: center;
    }

    #after {
      height: 100vh;
      background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: white;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    #final {
      height: 100vh;
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      color: white;
      font-weight: bold;
      text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    @media (max-width: 768px) {
      .scaled {
        font-size: 2.5rem;
        padding: 0 1rem;
      }
      
      .scrolled-block {
        max-width: 90%;
        padding: 2rem;
      }
      
      .scrolled-block h2 {
        font-size: 1.5rem;
      }
      
      .scrolled-block p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <section id="trigger">
    <div class="scaled">Scroll Down and Watch Me Disappear</div>
    <div class="scrolled-block">
      <h2>🚀 Amazing Content Block</h2>
      <p>This block smoothly slides up and covers the text above.</p>
      <p>It scales and moves perfectly with your scroll!</p>
      <p>Scroll back up to see the reverse animation.</p>
    </div>
  </section>

  <section id="after">Keep Scrolling Down</section>
  
  <section id="final">End of Demo</section>

  <script>
    const trigger = document.getElementById('trigger');
    const scaled = trigger.querySelector('.scaled');
    const block = trigger.querySelector('.scrolled-block');

    let ticking = false;

    function updateScrollEffect() {
      const rect = trigger.getBoundingClientRect();
      const windowHeight = window.innerHeight;
      
      // Calculate scroll progress based on the trigger section
      let progress = 0;
      
      if (rect.top <= 0 && rect.bottom >= 0) {
        // Calculate how much of the section has been scrolled
        progress = Math.abs(rect.top) / windowHeight;
        progress = Math.min(Math.max(progress, 0), 1);
      } else if (rect.top > 0) {
        // Before trigger section
        progress = 0;
      } else {
        // After trigger section  
        progress = 1;
      }

      // Apply faster easing function for quicker animation
      const easeProgress = progress < 0.3 
        ? 8 * progress * progress * progress
        : 1 - Math.pow(-3 * progress + 3, 2) / 2;

      // Scale down and fade the text (make it smaller as we scroll)
      const scale = 1 - 0.8 * easeProgress; // Scale from 1 to 0.2 (gets smaller)
      const opacity = 1 - easeProgress; // Fade from 1 to 0
      
      scaled.style.transform = `translate(-50%, -50%) scale(${scale})`;
      scaled.style.opacity = opacity;

      // Move block up faster - complete animation in first 60% of scroll
      // Start at 100% below (completely hidden) and move to 0% (covering the text)
      const acceleratedProgress = Math.min(progress / 0.6, 1); // Complete animation in first 60% of scroll
      const translateY = 100 - (100 * acceleratedProgress);
      
      block.style.transform = `translateX(-50%) translateY(${translateY}%)`;

      ticking = false;
    }

    function requestTick() {
      if (!ticking) {
        requestAnimationFrame(updateScrollEffect);
        ticking = true;
      }
    }

    // Optimized scroll listener
    window.addEventListener('scroll', requestTick, { passive: true });
    window.addEventListener('resize', requestTick);

    // Initial call
    updateScrollEffect();
  </script>

</body>
</html>
